<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e17">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>JarvisOS Video Meet | Xavfsiz Video Suhbat</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <!-- LOBBY SCREEN (Mobile First) -->
  <div id="lobby-screen" class="screen active">
    <div class="lobby-container">
      <header class="lobby-header">
        <div class="brand-logo">📹</div>
        <div class="brand-info">
          <h1>JarvisOS Meet</h1>
          <p>Xavfsiz va tejamkor P2P video suhbat</p>
        </div>
      </header>

      <div class="lobby-preview-wrapper">
        <video id="lobby-preview" autoplay playsinline muted></video>
        <div class="preview-badge">
          <span class="status-dot"></span>
          <span id="preview-status">Kamera faol</span>
        </div>
        <button id="btn-flip-preview" class="btn-flip-cam" title="Kamerani almashtirish">🔄</button>
      </div>

      <div class="lobby-form">
        <div class="input-field">
          <label for="user-name-input">Ismingiz</label>
          <input type="text" id="user-name-input" placeholder="Ismingizni kiriting..." maxlength="25" autocomplete="name">
        </div>

        <div class="input-field">
          <label for="room-id-input">Xona kodi (ixtiyoriy)</label>
          <input type="text" id="room-id-input" placeholder="Bo'sh qolsa yangi xona ochiladi" autocomplete="off">
        </div>

        <button id="btn-join-room" class="btn-primary-action">
          <span>🚀 Suhbatga Kirish</span>
        </button>
      </div>
    </div>
  </div>

  <!-- MEETING ROOM SCREEN (Mobile First) -->
  <div id="meet-screen" class="screen">
    <!-- Top Mobile Navigation Bar -->
    <header class="meet-topbar">
      <div class="room-pill">
        <span class="live-dot"></span>
        <span id="display-room-id" class="room-name">Xona</span>
      </div>
      <div class="topbar-actions">
        <button id="btn-copy-link" class="btn-pill" title="Havolani nusxalash">
          🔗 <span>Ulashish</span>
        </button>
      </div>
    </header>

    <!-- Video Stage -->
    <main class="meet-stage">
      <div id="video-grid" class="video-grid">
        <!-- Local User Video -->
        <div class="video-tile local-tile" id="local-video-container">
          <video id="local-video" autoplay playsinline muted></video>
          <div class="tile-tag">
            <span id="local-user-badge">Siz</span>
            <span id="local-mic-icon">🎤</span>
          </div>
        </div>
      </div>

      <!-- Slide-over / Bottom-sheet Mobile Chat -->
      <div id="chat-panel" class="chat-drawer hidden">
        <div class="chat-drawer-handle" id="chat-drag-handle"></div>
        <div class="chat-drawer-header">
          <h3>💬 Xona Chati</h3>
          <button id="btn-close-chat" class="btn-close-drawer">&times;</button>
        </div>
        <div id="chat-messages" class="chat-messages-scroll"></div>
        <form id="chat-form" class="chat-input-form">
          <input type="text" id="chat-input" placeholder="Xabar yozing..." autocomplete="off">
          <button type="submit" class="btn-chat-send">➤</button>
        </form>
      </div>
    </main>

    <!-- Bottom Mobile-First Controls -->
    <footer class="meet-bottombar">
      <button id="btn-toggle-mic" class="bar-btn" title="Mikrofon">
        <span class="bar-icon">🎤</span>
        <span class="bar-text">Ovoz</span>
      </button>

      <button id="btn-toggle-cam" class="bar-btn" title="Kamera">
        <span class="bar-icon">📹</span>
        <span class="bar-text">Video</span>
      </button>

      <button id="btn-flip-cam-active" class="bar-btn" title="Kamerani almashtirish">
        <span class="bar-icon">🔄</span>
        <span class="bar-text">Burish</span>
      </button>

      <button id="btn-toggle-speaker" class="bar-btn" title="Karnay / Dinamikni almashtirish">
        <span class="bar-icon" id="speaker-icon">🔊</span>
        <span class="bar-text" id="speaker-text">Karnay</span>
      </button>

      <button id="btn-share-screen" class="bar-btn" title="Ekran ulashish">
        <span class="bar-icon">🖥️</span>
        <span class="bar-text">Ekran</span>
      </button>

      <button id="btn-toggle-chat" class="bar-btn" title="Chat">
        <span class="bar-icon">💬</span>
        <span class="bar-text">Chat</span>
        <span id="chat-badge" class="chat-unread-dot hidden"></span>
      </button>

      <button id="btn-leave-call" class="bar-btn btn-leave" title="Tugatish">
        <span class="bar-icon">📞</span>
        <span class="bar-text">Chiqish</span>
      </button>
    </footer>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast-popup"></div>

  <script src="script.js"></script>
</body>
</html>
